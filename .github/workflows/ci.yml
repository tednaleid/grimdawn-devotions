# ABOUTME: CI gate — runs `just check` (tests, lint, type-check) on every push to main and on PRs.
# ABOUTME: Runs on Linux AND Windows so the cross-platform (bash/just) build promise stays honest.
name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # scripts/ are standalone `uv run --script` programs, and `just lint-py` shells
      # out to `uvx ruff`. Without uv on the runner that recipe exits 127, not 0.
      # Pinned to an exact release: setup-uv stopped publishing moving major tags after v7.
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install web dependencies
        run: just web-install
      - name: Run checks (tests, lint, type-check)
        run: just check
      # The script suites are not part of `just check` because one of them, test_gditems_cli,
      # drives the real CLI against data/derived, which is never in git. Fetching it is what
      # buys that end-to-end leg; the pin in deposit.lock makes the download reproducible.
      - name: Fetch the pinned item dataset
        run: just fetch-deposit
      - name: Run the script test suites
        run: just test-scripts
